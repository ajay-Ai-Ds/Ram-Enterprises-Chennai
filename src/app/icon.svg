<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="reShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F2137" />
      <stop offset="50%" stopColor="#0A1829" />
      <stop offset="100%" stopColor="#06101C" />
    </linearGradient>
    <linearGradient id="reCopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E59E67" />
      <stop offset="40%" stopColor="#D08A52" />
      <stop offset="80%" stopColor="#B87333" />
      <stop offset="100%" stopColor="#8C4F1D" />
    </linearGradient>
    <linearGradient id="reNavyLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#627D98" />
      <stop offset="100%" stopColor="#1A3A5C" />
    </linearGradient>
    <filter id="reGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#06101C" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Faceted Structural Shield -->
  <path d="M 50 6 L 88 19 C 88 54, 73 80, 50 94 C 27 80, 12 54, 12 19 Z"
        fill="url(#reShieldBg)"
        stroke="url(#reCopperGrad)"
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#reGlow)"/>

  <!-- Inner Protective Border -->
  <path d="M 50 13 L 81 24 C 81 50, 68 73, 50 85 C 32 73, 19 50, 19 24 Z"
        fill="none"
        stroke="url(#reNavyLine)"
        stroke-width="1.2"
        stroke-opacity="0.8"/>

  <!-- Interlaced High-Tensile Safety Cable Mesh Grid -->
  <g stroke="url(#reCopperGrad)" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="1.5,1.5">
    <line x1="28" y1="28" x2="72" y2="72" />
    <line x1="72" y1="28" x2="28" y2="72" />
    <line x1="22" y1="42" x2="78" y2="42" />
    <line x1="26" y1="56" x2="74" y2="56" />
    <line x1="38" y1="22" x2="62" y2="78" />
    <line x1="62" y1="22" x2="38" y2="78" />
  </g>

  <!-- Central Architectural Stylized 'R' Monogram (Ram Enterprises) -->
  <!-- Left Pillar -->
  <path d="M 32 26 L 43 26 L 43 70 L 32 70 Z"
        fill="#FFFFFF"
        stroke="#0F2137"
        stroke-width="0.7"/>

  <!-- Upper Copper Loop -->
  <path d="M 43 26 L 58 26 C 66 26, 71 30, 71 37 C 71 44, 66 48, 58 48 L 43 48 Z M 43 34 L 56 34 C 59 34, 61 35.5, 61 37 C 61 38.5, 59 40, 56 40 L 43 40 Z"
        fill="url(#reCopperGrad)"
        stroke="#0F2137"
        stroke-width="0.7"/>

  <!-- Lower Structural Anchor Leg -->
  <path d="M 50 46 L 62 46 L 73 70 L 61 70 L 51 49 Z"
        fill="url(#reCopperGrad)"
        stroke="#0F2137"
        stroke-width="0.7"/>

  <!-- Decorative Safety Anchor Nodes & Apex Diamond -->
  <polygon points="50,16 54,21 50,26 46,21" fill="url(#reCopperGrad)"/>
  <circle cx="50" cy="21" r="1.2" fill="#FFFFFF"/>
  <circle cx="32" cy="70" r="1.6" fill="url(#reCopperGrad)"/>
  <circle cx="73" cy="70" r="1.6" fill="url(#reCopperGrad)"/>
</svg>